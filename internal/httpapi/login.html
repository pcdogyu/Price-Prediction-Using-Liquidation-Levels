<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录 · 清算墙概率雷达</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 75% 0,#173b50 0,transparent 40%),#061019;color:#edf7fc;font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}.card{width:min(420px,calc(100vw - 30px));padding:28px;border:1px solid #274252;border-radius:20px;background:#0c1b26ef;box-shadow:0 25px 80px #0008}.eyebrow{color:#2dd4bf;font-size:11px;letter-spacing:.14em;text-transform:uppercase}h1{font-size:30px;margin:7px 0 5px}.note{color:#83a0b2;margin:0 0 22px}.field{display:block;margin-top:14px;color:#a8c0ce}.field input{width:100%;margin-top:6px;border:1px solid #315064;border-radius:10px;background:#07141d;color:#edf7fc;padding:12px;font:inherit}.field input:focus{outline:2px solid #2dd4bf55;border-color:#2dd4bf}.error{color:#fecdd3;background:#32121c;border:1px solid #7f1d32;border-radius:9px;padding:9px 11px;margin:14px 0 0}.error:empty{display:none}button{width:100%;margin-top:20px;border:0;border-radius:10px;background:#edf7fc;color:#061019;padding:12px;font-weight:750;cursor:pointer}.security{color:#607f91;font-size:12px;margin:16px 0 0}
</style>
</head>
<body><main class="card"><div class="eyebrow">Protected diagnostics</div><h1>清算墙概率雷达</h1><p class="note">登录后查看行情、预测和程序日志。</p><div class="error" role="alert">{{ERROR}}</div><form method="post" action="{{LOGIN_ACTION}}"><label class="field">用户名<input name="username" autocomplete="username" required autofocus></label><label class="field">密码<input name="password" type="password" autocomplete="current-password" required></label><button type="submit">登录</button></form><p class="security">会话有效期 7 天，服务更新后仍保持登录。连续失败会触发临时锁定。</p></main></body>
</html>
